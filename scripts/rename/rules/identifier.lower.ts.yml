id: identifier-lower-ts
language: TypeScript
# TIER 2 — renames identifier nodes containing 'paperclip' -> 'pilot'. Strings, comments,
# and import path literals are untouched by construction.
severity: info
rule:
  kind: identifier
  pattern: $ID
constraints:
  ID:
    regex: paperclip
transform:
  NEW:
    replace:
      source: $ID
      replace: paperclip
      by: pilot
fix: $NEW
