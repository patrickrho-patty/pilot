id: env-string-literal-rename
language: TypeScript
# Rewrites "PAPERCLIP_X" string literals (env-name keys in spawn/env objects,
# config docs). Generated — do not edit.
severity: info
rule:
  pattern: '"$NAME"'
constraints:
  NAME:
    regex: ^PAPERCLIP_[A-Z0-9_]+$
transform:
  SUFFIX:
    substring:
      source: $NAME
      startChar: 10
fix: '"__TARGET___$SUFFIX"'
