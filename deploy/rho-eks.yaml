# Pilot on rho-cluster (EKS ap-northeast-2).
#
# Profile: embedded PostgreSQL persisted on an encrypted EBS gp3 PVC under /pilot,
# matching the Docker quickstart contract (doc/DOCKER.md). Migrating to RDS
# later is a values-only change: set DATABASE_URL in the pilot-secrets secret
# and adjust persistence as needed.
#
# Image: built by .github/workflows/ecr-build-deploy.yml; CI overrides the
# tag at upgrade time with `--set image.tag=<dispatched-tag>`.

image:
  repository: 361645878435.dkr.ecr.ap-northeast-2.amazonaws.com/pilot
  tag: v0.1.0-pilot

ingress:
  enabled: true
  className: alb
  host: pilot.patty.io
  annotations:
    alb.ingress.kubernetes.io/subnets: >-
      subnet-09c2e49c03d8b0660,subnet-01004009d9dbf07cf,subnet-092f8d62be99bdd3c
  # Crew desktop auto-updates proxy (crew-updates bucket presign redirect).
  # Live objects: deployment/service/secret applied directly in the cluster;
  # this only owns the /updates path rule on the shared ALB ingress.
  updatesProxy:
    enabled: true
    serviceName: updates-proxy
    servicePort: 80

config:
  PILOT_PUBLIC_URL: https://pilot.patty.io
  PILOT_DEPLOYMENT_MODE: authenticated
  TRUST_PROXY: loopback

resources:
  requests:
    cpu: "1"
    memory: 2Gi
  limits:
    cpu: "2"
    memory: 4Gi

persistence:
  enabled: true
  size: 20Gi
  storageClass: gp3-encrypted

existingSecret: pilot-secrets

# Crew–Pilot bridge (PAT-1982). Its worker identity and the relay-admin key
# live in the crew-bridge-secrets secret, created out-of-band in the cluster.
bridge:
  image:
    tag: v0.1.0-pilot
  crewRelayUrl: wss://crew.patty.io
  pilotBaseUrl: https://pilot.patty.io
  persistence:
    storageClass: gp3-encrypted
