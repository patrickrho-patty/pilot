{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "pilot.fullname" . }}
  labels:
    {{- include "pilot.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          {{- if .Values.ingress.updatesProxy.enabled }}
          # Crew desktop auto-updates: 302-presign proxy in front of the
          # private crew-updates Wasabi bucket (rho-cluster, infra owned by
          # the crew repo: infra/updates-proxy). Must precede the / catch-all.
          - path: /updates
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.ingress.updatesProxy.serviceName }}
                port:
                  number: {{ .Values.ingress.updatesProxy.servicePort }}
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "pilot.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}
